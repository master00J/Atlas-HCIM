<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HCIM Atlas · Webcam Frame</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;margin:0;background:transparent}
.frame{position:absolute;inset:3px;border:3px solid #c9a769;border-radius:14px;box-shadow:0 0 0 2px rgba(10,14,20,.9),0 0 16px rgba(0,0,0,.5),inset 0 0 0 2px rgba(8,12,16,.65);pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;top:7px;width:11px;height:11px;transform:rotate(45deg);background:#d6a14c;box-shadow:0 0 7px #d6a14c55}
.frame::before{left:8px}.frame::after{right:8px}
.label{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);padding:4px 14px;background:rgba(10,14,20,.91);border:1px solid #c9a769;border-radius:6px 6px 0 0;font:800 12px 'Trebuchet MS',Arial,sans-serif;letter-spacing:.1em;color:#e7cb91;white-space:nowrap}
</style>
</head>
<body><div class="frame"><span class="label">HCIM ATLAS</span></div></body>
</html>
